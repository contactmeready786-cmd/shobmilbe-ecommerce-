# temporary (2026-11-17): fetches the free Manrope font (SIL OFL, via the @fontsource-variable/manrope package) into
# public/fonts for the admin's Veylix look. Removed again before merging.
name: tmp-font
on:
  push:
    branches: ['veylix-step3']
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Manrope
        run: |
          cd "$RUNNER_TEMP" && npm pack @fontsource-variable/manrope@5 && tar xzf fontsource-variable-manrope-*.tgz
          ls package/files | head -40
          cp package/files/manrope-latin-wght-normal.woff2 "$GITHUB_WORKSPACE/public/fonts/manrope-latin-wght-normal.woff2"
          cp package/LICENSE "$GITHUB_WORKSPACE/public/fonts/manrope-LICENSE.txt" || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git diff --cached --quiet || git commit -m "Add the Manrope font (SIL OFL) for the admin"
          git push
