name: diag-live
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          exec > >(tee out.txt) 2>&1
          U=https://shobmilbe-ecommerce.vercel.app
          curl -sS -A "Mozilla/5.0 (Linux; Android 14) Mobile" "$U/" -o home.html -D h.txt; head -20 h.txt
          echo "== notice part"; grep -o '<div class="notice[^>]*>.\{0,900\}' home.html | head -c 1500; echo
          echo "== scripts"; grep -o '<script src="[^"]*"' home.html
          echo "== api"; curl -sS "$U/api/live/cricket" | head -c 300; echo
          npm i -g playwright@1.56.0 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require(process.env.NODE_PATH_G+'/playwright');
          (async()=>{const b=await chromium.launch();for(const vp of [{width:412,height:900},{width:1280,height:800}]){const p=await b.newPage({viewport:vp,userAgent:vp.width<500?'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36':undefined});const e=[];p.on('pageerror',x=>e.push('PAGEERR '+x.message));p.on('console',m=>{if(m.type()==='error')e.push('CONSOLE '+m.text())});p.on('requestfailed',r=>e.push('FAIL '+r.url()));
          await p.goto('https://shobmilbe-ecommerce.vercel.app/',{waitUntil:'networkidle'});await p.waitForTimeout(3000);
          console.log(vp.width,JSON.stringify(await p.evaluate(()=>{const t=document.querySelector('.live-tick');const n=document.querySelector('[data-notice]');return {tick:!!t,hidden:t&&t.hidden,w:t&&t.getBoundingClientRect().width,text:t&&t.textContent,noticeDisp:n&&getComputedStyle(n).display,noticeCls:n&&n.className}})),e.slice(0,10));}await b.close();})();
          JS
          NODE_PATH_G=$(npm root -g) node t.js
          sleep 1
          python3 - <<'PY'
          d=open('out.txt').read()[-6000:].replace('%','%25').replace('\r','').replace('\n','%0A')
          print('::warning title=diag::'+d)
          PY
