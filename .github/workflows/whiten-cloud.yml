# ☁️ ব্যাকগ্রাউন্ড সাদা — অনলাইনে (owner, 2026-10-24): the pictures the owner sends from Admin → ব্যাকগ্রাউন্ড সাদা are
# made white here, on GitHub's computers (free for this public repository) — never on the owner's laptop or phone.
# Every few minutes: a quick look at GET /api/whiten-jobs; when pictures wait, tools/whiten/cloud.py makes them and
# commits each one to the `whiten-results` branch as soon as it is ready (the shop reads them from there), then keeps
# watching for more a few minutes.
# The results branch is its own clone (never a worktree of the sparse checkout: files outside the sparse set can't be
# added there — that stopped the first run, 2026-10-24).
name: whiten-cloud
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whiten-cloud
  cancel-in-progress: false
jobs:
  whiten:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SHOP: https://shobmilbe.com
    steps:
      - name: Anything waiting?
        id: look
        run: |
          code=$(curl -sS -o jobs.json -w '%{http_code}' -A shobmilbe-whiten-cloud "$SHOP/api/whiten-jobs" || echo 000)
          n=$(python3 -c 'import json; d=json.load(open("jobs.json")); print(len(d.get("jobs", [])) + len(d.get("emb", [])))' 2>/dev/null || echo 0)
          if [ "$code" != 200 ]; then echo "::warning::the shop's list answered $code: $(head -c 120 jobs.json 2>/dev/null)"; n=0; fi
          echo "waiting: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.look.outputs.n != '0'
        with:
          sparse-checkout: |
            tools/whiten
            public/vendor/birefnet
            public/vendor/dinov2
      - uses: actions/setup-python@v6
        if: steps.look.outputs.n != '0'
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/whiten/requirements.txt }
      - name: Make the pictures white
        if: steps.look.outputs.n != '0'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          pip install -q -r tools/whiten/requirements.txt
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code "$URL" whiten-results >/dev/null; then
            git clone -q --depth 1 --branch whiten-results "$URL" /tmp/res
          else
            git init -q -b whiten-results /tmp/res && git -C /tmp/res remote add origin "$URL" && mkdir -p /tmp/res/results
            echo '# Pictures made white by .github/workflows/whiten-cloud.yml — read by the shop (lib/models/whitencloud.ts)' > /tmp/res/README.md
            echo '{"git":{"deploymentEnabled":false}}' > /tmp/res/vercel.json
            echo '{}' > /tmp/res/results/index.json
          fi
          git -C /tmp/res config user.name whiten-cloud && git -C /tmp/res config user.email actions@github.com
          python tools/whiten/cloud.py --shop "$SHOP" --out /tmp/res --minutes 12
