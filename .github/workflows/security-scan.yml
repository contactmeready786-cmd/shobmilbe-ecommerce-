# 🛡️ Outside look at the server (read-only, 2026-11-19): what a stranger on the internet can reach on the VPS.
# Changes nothing on the server. Runs only when pushed to the diag-security branch.
name: security-scan
on:
  push:
    branches: [diag-security]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Outside checks
        run: |
          IP=51.79.166.142
          echo "== Open ports on the server (seen from the internet) =="
          for p in 21 22 23 25 53 80 110 143 443 2222 3000 3001 3306 5432 5433 6379 8000 8080 8443 9000 9090 11211 27017; do
            if timeout 4 bash -c "</dev/tcp/$IP/$p" 2>/dev/null; then echo "OPEN   $p"; else echo "closed $p"; fi
          done
          echo "== SSH banner =="
          timeout 5 bash -c "exec 3<>/dev/tcp/$IP/22; head -c 80 <&3" 2>/dev/null || echo "(no answer)"
          echo
          echo "== SSH login methods allowed =="
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PubkeyAuthentication=no nobody-check@$IP true 2>&1 | grep -i "permission denied\|refused\|timed out" || true
          echo "== Website straight from the server, skipping Cloudflare =="
          echo "https: $(curl -sk -o /dev/null -m 10 -w '%{http_code}' --resolve shobmilbe.com:443:$IP https://shobmilbe.com/robots.txt || echo fail)"
          echo "http by IP: $(curl -s -o /dev/null -m 10 -w '%{http_code}' http://$IP/ || echo fail)"
          echo "https by IP: $(curl -sk -o /dev/null -m 10 -w '%{http_code}' https://$IP/ || echo fail)"
          echo "next.js port 3000: $(curl -s -o /dev/null -m 6 -w '%{http_code}' http://$IP:3000/ || echo fail)"
          echo "== Through Cloudflare =="
          curl -sI -m 15 https://shobmilbe.com/robots.txt | grep -i "^HTTP\|^server:\|^cf-ray" | sed 's/cf-ray:.*/cf-ray: present/I'
          echo "== TLS versions (through Cloudflare) =="
          for v in tls1 tls1_1 tls1_2 tls1_3; do r=$(echo | timeout 8 openssl s_client -connect shobmilbe.com:443 -servername shobmilbe.com -$v 2>&1 | grep -c "BEGIN CERTIFICATE\|Cipher is (NONE)\|Protocol  *:"); echo "$v: $(echo | timeout 8 openssl s_client -connect shobmilbe.com:443 -servername shobmilbe.com -$v 2>/dev/null | grep -q 'BEGIN CERTIFICATE' && echo accepted || echo refused)"; done
