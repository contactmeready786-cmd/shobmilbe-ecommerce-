name: Database move status
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=$(curl -s -m 30 https://shobmilbe-ecommerce.vercel.app/__dbmove | head -c 900)
          echo "::notice title=status::$R"
          P=$(curl -s -m 30 -X POST https://shobmilbe-ecommerce.vercel.app/__dbmove | head -c 900)
          echo "::notice title=step::$P"
          Q=$(curl -s -m 30 https://shobmilbe-ecommerce.vercel.app/__dbmove/report | head -c 900)
          echo "::notice title=report::$Q"
          C=$(curl -s -m 30 -o /dev/null -w "%{http_code} %{redirect_url}" https://shobmilbe-ecommerce.vercel.app/)
          echo "::notice title=home::$C"
