name: ticks-check
on: push
jobs:
  c:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          out=""
          for p in /api/research/tick /api/backup/tick /api/aistaff/tick /api/whiten-jobs /robots.txt /sitemap.xml /feeds/google.xml; do
            code=$(curl -sS -m 60 -o b.txt -w '%{http_code}' -A shobmilbe-tick "https://shobmilbe.com$p" || echo 000)
            out="$out $p=$code($(head -c 60 b.txt | tr -d '\n' | tr -c '[:print:]' ' '))"
          done
          echo "::notice::$out"
