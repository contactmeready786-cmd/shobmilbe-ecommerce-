# SPARE nightly database backup kept on GitHub (the shop's main backup runs inside the site itself, to ImageKit —
# lib/services/autobackup.ts). This one only runs once the two secrets below are added; until then it says "Skipped".
# Set up once (GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret):
#   DATABASE_URL     = the same value as in Vercel (Settings → Environment Variables)
#   BACKUP_PASSWORD  = a long password you keep safe (needed to restore; without it the backup can't be opened)
# Each night's file is kept for 30 days under Actions → backup → (a run) → Artifacts.
name: backup
on:
  schedule:
    - cron: "11 21 * * *" # 03:11 Dhaka time
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check secrets
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSWORD" ]; then
            echo "::notice::Skipped — this spare GitHub backup is not set up. The shop's own nightly backup (to ImageKit, Admin → ব্যাকআপ) is the real one."
            echo "⏭️ Skipped: the spare GitHub backup has no DATABASE_URL / BACKUP_PASSWORD secrets. The shop backs itself up every night to ImageKit (Admin → ব্যাকআপ), and e-mails the owner if a night is missed." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Make the backup
        if: steps.check.outputs.ready == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx tsx tools/backup.ts backups
      - name: Keep it for 30 days
        if: steps.check.outputs.ready == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: shobmilbe-backup-${{ github.run_id }}
          path: backups/*.smbk
          retention-days: 30
          if-no-files-found: error
