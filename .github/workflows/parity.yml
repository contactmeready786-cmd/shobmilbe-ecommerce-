name: parity
# Builds the Next.js version and compares every page with the current live code (main), page by page,
# on a throw-away test database. Nothing here touches the real shop or its database.
on:
  push:
    branches: [nextjs-migration]
  workflow_dispatch: {}
permissions:
  contents: write # only to save the results on the ci-results branch
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash # with pipefail, so a failing step piped into tee still fails
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: parity
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: parity
      PGPORT: '5432'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { path: new }
      - uses: actions/checkout@v4
        with: { path: old, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install packages
        working-directory: new
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          { npm ls next react react-dom typescript --depth=0; echo "latest on npm:"; for p in next react typescript @sentry/nextjs; do echo "$p $(npm view $p version)"; done; } | tee "$RUNNER_TEMP/versions.txt" || true
      - name: Type check
        working-directory: new
        run: npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/typecheck.txt"
      - name: Tests
        working-directory: new
        env: { LIVE_DNS: '1' }
        run: npx tsx --test --test-force-exit tests/*.test.ts tests/*.test.tsx 2>&1 | tee "$RUNNER_TEMP/tests.txt"
      - name: Build
        working-directory: new
        run: npx next build 2>&1 | tee "$RUNNER_TEMP/build.txt"

      # main is the live code. Since the move to Next.js it is built and started like the new side;
      # an older main (plain Node, server.js) is started the old way.
      - name: Prepare the current site (main)
        working-directory: old
        run: |
          if grep -q '"next"' package.json; then
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            npx next build > "$RUNNER_TEMP/old-build.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/old-build.txt"; exit 1; }
            echo "OLD_START=npx next start" >> "$GITHUB_ENV"  # the port comes from PORT, set by run.sh
          else
            echo "OLD_START=node server.js" >> "$GITHUB_ENV"
          fi
      - name: Test database (template)
        working-directory: old
        run: ../new/tools/parity/make-template.sh 3101 $OLD_START
      - name: Crawl the current site (main)
        working-directory: old
        run: ../new/tools/parity/run.sh "$RUNNER_TEMP/old" 3102 $OLD_START
      - name: Crawl the Next.js site
        working-directory: new
        run: tools/parity/run.sh "$RUNNER_TEMP/new" 3200 npx next start -p 3200
      - name: Compare every page
        working-directory: new
        run: node tools/parity/compare.mjs "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" --show 40 | tee "$RUNNER_TEMP/compare.txt"
      - name: Route coverage (which addresses the crawl reached)
        if: always()
        working-directory: new
        run: node tools/parity/coverage.mjs "$RUNNER_TEMP/new" | tee "$RUNNER_TEMP/coverage.txt"
      - name: Same actions on both (orders, products, uploads, status changes)
        if: always()
        run: |
          set -o pipefail
          {
            (cd old && SCENARIOS=1 ../new/tools/parity/run.sh "$RUNNER_TEMP/scen-old" 3102 $OLD_START) 2>&1 || echo "old site run failed"
            (cd new && SCENARIOS=1 tools/parity/run.sh "$RUNNER_TEMP/scen-new" 3200 npx next start -p 3200) 2>&1 || echo "new site run failed"
            tail -30 "$RUNNER_TEMP/scen-new.server.log" 2>/dev/null
          } > "$RUNNER_TEMP/scenarios.txt"
          if cmp -s "$RUNNER_TEMP/scen-old.json" "$RUNNER_TEMP/scen-new.json"; then echo "actions: identical" >> "$RUNNER_TEMP/scenarios.txt"
          else { echo "actions: DIFFERENT"; diff <(python3 -m json.tool "$RUNNER_TEMP/scen-old.json") <(python3 -m json.tool "$RUNNER_TEMP/scen-new.json") | head -80; } >> "$RUNNER_TEMP/scenarios.txt"; cat "$RUNNER_TEMP/scenarios.txt"; exit 1; fi
          cat "$RUNNER_TEMP/scenarios.txt"
      - name: Real browser (Next.js pages open, React takes over, the site's scripts run)
        if: always()
        working-directory: new
        run: |
          npm i --no-save --no-audit --no-fund playwright-core@1.49.1 >/dev/null 2>&1
          BROWSER=1 tools/parity/run.sh "$RUNNER_TEMP/browser" 3300 npx next start -p 3300 2>&1 | tee "$RUNNER_TEMP/browser.txt"
      # Results go to the separate "ci-results" branch (text only — no shop data, test data only).
      - name: Save results
        if: always()
        working-directory: new
        run: |
          OUT="$RUNNER_TEMP/results"; mkdir -p "$OUT"
          cp package-lock.json "$OUT/" 2>/dev/null || true
          for f in versions typecheck tests build compare compare-all coverage scenarios browser; do cp "$RUNNER_TEMP/$f.txt" "$OUT/" 2>/dev/null || true; done
          [ -d "$RUNNER_TEMP/diff-pages" ] && cp -r "$RUNNER_TEMP/diff-pages" "$OUT/"
          for f in "$RUNNER_TEMP"/*.server.log; do [ -f "$f" ] && tail -c 20000 "$f" > "$OUT/$(basename "$f")"; done
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/RESULT"
          echo '{"git":{"deploymentEnabled":false}}' > "$OUT/vercel.json"  # Vercel must never build this branch
          cd "$OUT"
          git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "parity results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
