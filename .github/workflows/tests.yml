# ✅ Automatic checks on every change (owner, 2026-10-17): before anything reaches the live shop, GitHub
#   1. checks the TypeScript for mistakes,
#   2. runs every test in tests/ — the price rules, checkout OTP, placing orders, security locks — the database
#      tests on a brand-new EMPTY Postgres made just for this run (never the shop's real database),
#   3. builds the site exactly like Vercel does.
# A red ❌ here means: don't put this change live. Nothing here touches the real shop, its database or its SMS.
name: tests
on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Tests (with a throw-away database)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/shop_test?sslmode=disable
          LIVE_DNS: '1' # GitHub's machines have internet: also check a real Googlebot address
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || status=$?
          # failing tests show up as notes on the run (readable without opening the log)
          { grep -nE -A16 "^not ok" "$RUNNER_TEMP/tests.txt" || true; } | head -60 | while IFS= read -r l; do echo "::error title=test::${l:0:900}"; done
          pass=$(awk '$2 == "pass" && ($1 == "ℹ" || $1 == "#") && $3 ~ /^[0-9]+$/ {s += $3} END {print s + 0}' "$RUNNER_TEMP/tests.txt")
          fail=$(awk '$2 == "fail" && ($1 == "ℹ" || $1 == "#") && $3 ~ /^[0-9]+$/ {s += $3} END {print s + 0}' "$RUNNER_TEMP/tests.txt")
          skipped=$(awk '$2 == "skipped" && ($1 == "ℹ" || $1 == "#") && $3 ~ /^[0-9]+$/ {s += $3} END {print s + 0}' "$RUNNER_TEMP/tests.txt")
          total=$(awk '$2 == "tests" && ($1 == "ℹ" || $1 == "#") && $3 ~ /^[0-9]+$/ {s += $3} END {print s + 0}' "$RUNNER_TEMP/tests.txt")
          files=$(ls tests/*.test.ts tests/*.test.tsx 2>/dev/null | wc -l)
          ran=$(grep -cE '^(# Subtest|▶|✔|✖) ' "$RUNNER_TEMP/tests.txt" || true)
          cancelled=$(awk '$2 == "cancelled" && ($1 == "ℹ" || $1 == "#") && $3 ~ /^[0-9]+$/ {s += $3} END {print s + 0}' "$RUNNER_TEMP/tests.txt")
          echo "::notice title=Tests::passed $pass of $total, failed $fail, skipped $skipped, cancelled $cancelled ($files test files)"
          echo "✅ Tests: $pass passed, $fail failed, $skipped skipped, $cancelled cancelled" >> "$GITHUB_STEP_SUMMARY"
          # the database tests must really run here, never be skipped quietly; and something must have run at all
          if [ "$pass" = "0" ]; then echo "::error::no test results found"; exit 1; fi
          if [ "$skipped" != "0" ]; then echo "::error::$skipped tests were skipped"; exit 1; fi
          # a test stopped before it finished (timeout, a crash in its file) proved nothing: that is a failure too
          if [ "$cancelled" != "0" ]; then echo "::error::$cancelled tests were cancelled before they finished"; exit 1; fi
          # every test that was found must have passed (none lost on the way)
          if [ "$pass" != "$total" ]; then echo "::error::only $pass of $total tests passed"; exit 1; fi
          exit $status
      - name: Build like Vercel
        run: npm run build
